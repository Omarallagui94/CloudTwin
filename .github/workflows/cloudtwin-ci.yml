name: CloudTwin CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      current_twin:
        description: Repository-relative path to a discovered Current Twin JSON
        required: false
        type: string
      proposed_change:
        description: Repository-relative path to Terraform plan JSON or Kubernetes manifest
        required: false
        type: string
      change_kind:
        description: Proposed-change format
        required: false
        type: choice
        options: [terraform, kubernetes]
      artifact_run_id:
        description: Run ID containing a sanitized cloudtwin-risk-inputs artifact
        required: false
        type: string
      artifact_name:
        description: Artifact containing current-twin.json and proposed-change.json
        required: false
        default: cloudtwin-risk-inputs
        type: string
      deployment_risk:
        description: Explicitly request deployment-risk analysis for a real plan
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: cloudtwin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-validation:
    name: Local validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONPATH: ${{ github.workspace }}/cloudtwin-poc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloudtwin-poc/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Install CloudTwin dependencies
        run: python -m pip install --requirement cloudtwin-poc/requirements.txt

      - name: Check Python imports and compilation
        run: |
          python -m compileall -q cloudtwin-poc
          python -c "import analysis, analysis.engine, discovery.normalizer, ingestion, integration.hamdi_fatma, storage.neo4j_store"

      - name: Run Python, integration, and Streamlit AppTest suites
        run: python -m pytest cloudtwin-poc -q

      - name: Run integrated S01-S05 and report validation
        run: |
          python -m pytest cloudtwin-poc/tests/test_integrated_scenarios.py -q
          python -m pytest cloudtwin-poc/tests/test_reporting.py -q

      - name: Validate JSON schemas and normalized fixture output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from discovery.normalizer import normalize
          from jsonschema import Draft202012Validator

          schema_root = Path("cloudtwin-poc/schema/v1")
          schemas = sorted(schema_root.glob("*.schema.json"))
          for path in schemas:
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))

          twin = normalize({}, {}, "local-fixture-region", "local-fixture-cluster")
          twin_schema = json.loads((schema_root / "twin.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator(twin_schema).validate(twin)
          print(f"Validated {len(schemas)} schemas and one deterministic Twin fixture")
          PY

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform locally without a backend
        run: terraform -chdir=terraform/eks/minimal init -backend=false -input=false -no-color

      - name: Run safe local Terraform validation
        run: terraform -chdir=terraform/eks/minimal validate -no-color

      - name: Run Omar scenario and JSON/YAML validator
        run: python cloudtwin-poc/scripts/validate_scenarios.py

      - name: Download externally supplied risk inputs
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: cloudtwin-ci
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Determine changed files without failing open
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p cloudtwin-ci-artifacts
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > cloudtwin-ci-artifacts/changed-files.txt
          else
            : > cloudtwin-ci-artifacts/changed-files.txt
          fi

      - name: Resolve real risk-gate inputs
        id: risk-inputs
        env:
          INPUT_TWIN: ${{ inputs.current_twin }}
          INPUT_CHANGE: ${{ inputs.proposed_change }}
          INPUT_KIND: ${{ inputs.change_kind }}
          INPUT_DEPLOYMENT_RISK: ${{ inputs.deployment_risk }}
        run: |
          twin="${INPUT_TWIN:-cloudtwin-ci/current-twin.json}"
          if [[ ! -f "$twin" ]]; then twin="cloudtwin-poc/ci/sanitized-current-twin.json"; fi
          args=(--changed-files cloudtwin-ci-artifacts/changed-files.txt --current-twin "$twin" --github-output "$GITHUB_OUTPUT")
          if [[ -n "$INPUT_CHANGE" ]]; then args+=(--proposed-change "$INPUT_CHANGE")
          elif [[ -f cloudtwin-ci/proposed-change.json ]]; then args+=(--proposed-change cloudtwin-ci/proposed-change.json); fi
          if [[ -n "$INPUT_KIND" ]]; then args+=(--change-kind "$INPUT_KIND"); fi
          if [[ "${INPUT_DEPLOYMENT_RISK:-false}" == "true" || -n "$INPUT_CHANGE" || -n "$INPUT_KIND" ]]; then
            args+=(--deployment-risk)
          fi
          python cloudtwin-poc/scripts/resolve_ci_risk_inputs.py "${args[@]}"

      - name: Run real CloudTwin PR risk gate at 80
        if: steps.risk-inputs.outputs.enabled == 'true'
        run: |
          python cloudtwin-poc/scripts/ci_risk_gate.py \
            --twin "${{ steps.risk-inputs.outputs.twin }}" \
            --change "${{ steps.risk-inputs.outputs.change }}" \
            --kind "${{ steps.risk-inputs.outputs.kind }}" \
            --report cloudtwin-ci-artifacts/risk-analysis.json \
            --fail-at 80

      - name: Upload CloudTwin risk analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtwin-risk-analysis
          path: cloudtwin-ci-artifacts/risk-analysis.json
          if-no-files-found: warn

  upstream-validation:
    name: Upstream retail application checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: Semantic pull request
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint changed files
        run: |
          git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD | \
            yarn lefthook run pre-commit-ci --files-from-stdin
      - name: Build, test, and validate affected containers
        run: |
          yarn nx affected --targets=build --base origin/main --parallel 1
          yarn nx affected --targets=lint,test:integration,test --base origin/main
          yarn nx affected --targets=container --exclude='*,!tag:container' --base origin/main

  kind-scenarios:
    name: Optional Kind S01/S02
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kind and kubectl
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true

      - name: Validate S01 in Kind
        run: python cloudtwin-poc/scripts/validate_s01_kind.py

      - name: Validate S02 in Kind
        run: python cloudtwin-poc/scripts/validate_s02_kind.py
