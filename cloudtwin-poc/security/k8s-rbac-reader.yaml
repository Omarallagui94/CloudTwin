# Lecture seule des bindings RBAC, pour RULE-K8S-001 (ServiceAccount lié à cluster-admin).
# À associer au groupe Kubernetes "cloudtwin-rbac-readers" mappé dans aws-auth
# pour le rôle IAM du collecteur.
# Volontairement : aucune lecture de Secrets, aucun verbe d'écriture.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudtwin-rbac-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudtwin-rbac-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudtwin-rbac-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: cloudtwin-rbac-readers
