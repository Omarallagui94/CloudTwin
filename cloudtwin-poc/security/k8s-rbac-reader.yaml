# Lecture seule des bindings RBAC, pour RULE-K8S-001 (ServiceAccount lié à cluster-admin).
# À associer au groupe Kubernetes "cloudtwin-rbac-readers" de l'access entry EKS du collecteur,
# en plus de la politique d'accès AmazonEKSViewPolicy (qui ne donne pas les Secrets).
# Volontairement : aucune lecture de Secrets, aucun verbe d'écriture.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudtwin-rbac-reader
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudtwin-rbac-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudtwin-rbac-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: cloudtwin-rbac-readers
