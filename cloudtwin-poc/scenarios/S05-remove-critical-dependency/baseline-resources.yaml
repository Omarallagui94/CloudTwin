apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-postgresql
  namespace: default
spec:
  serviceName: orders-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-postgresql
    spec:
      containers:
        - name: postgresql
          image: public.ecr.aws/docker/library/postgres:16.1
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgresql
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: orders-postgresql
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      containers:
        - name: dependency-probe
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: ORDERS_DB_HOST
              value: orders-postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders
  ports:
    - name: http
      port: 80
      targetPort: 8080
