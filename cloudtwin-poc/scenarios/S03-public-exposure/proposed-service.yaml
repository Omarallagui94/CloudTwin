apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: default
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
